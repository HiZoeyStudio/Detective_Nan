<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11100e">
  <meta name="description" content="有楠必解侦探事务所——在邮件中接受委托，调查线索，破解案件。">
  <title>有楠必解侦探事务所</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" data-route="home" aria-label="返回事务所首页">
      <span class="brand-mark">楠</span>
      <span><strong>有楠必解</strong><small>侦探事务所</small></span>
    </button>
    <nav aria-label="主导航">
      <button data-route="home" class="nav-item active">事务所</button>
      <button data-route="inbox" class="nav-item mail-nav">委托邮件 <span id="mailBadge" class="badge">1</span></button>
      <button data-route="archive" class="nav-item">案件档案</button>
    </nav>
    <div class="status"><span></span>营业中</div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer>
    <span>© 2026 有楠必解侦探事务所</span>
    <span>真相藏在被忽略的细节里</span>
  </footer>

  <template id="homeTemplate">
    <section class="hero page-enter">
      <div class="hero-copy">
        <p class="eyebrow">YOU NAN DETECTIVE AGENCY · EST. 2026</p>
        <h1>世上没有<br><em>解不开的谜。</em></h1>
        <p class="intro">欢迎来到有楠必解侦探事务所。阅读来信，查验物证，听取证词——然后给出唯一合理的答案。</p>
        <button class="primary" data-route="inbox">查看新委托 <span>→</span></button>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="case-paper">
          <span class="paper-label">CONFIDENTIAL</span>
          <div class="paper-lines"></div>
          <div class="red-string one"></div><div class="red-string two"></div>
          <div class="photo photo-a"></div><div class="photo photo-b"></div>
          <div class="stamp">绝密<br><small>CASE FILE</small></div>
        </div>
        <div class="magnifier"></div>
      </div>
    </section>
    <section class="desk-strip page-enter delay">
      <article><span>01</span><div><strong>接收委托</strong><p>新案件会以邮件形式送达。</p></div></article>
      <article><span>02</span><div><strong>调查取证</strong><p>梳理证词与散落的线索。</p></div></article>
      <article><span>03</span><div><strong>提交推理</strong><p>锁定真相，完成案件报告。</p></div></article>
    </section>
  </template>

  <template id="inboxTemplate">
    <section class="mail-layout page-enter">
      <aside class="mail-sidebar">
        <div class="mail-title"><p class="eyebrow">AGENCY MAIL</p><h2>委托邮箱</h2></div>
        <button class="mail-folder active">收件箱 <span id="inboxCount">1</span></button>
        <button class="mail-folder">已归档 <span>0</span></button>
        <div class="tip"><strong>侦探守则 #01</strong><p>不要假设来信人说的每一句都是真的。</p></div>
      </aside>
      <div class="mail-content">
        <div class="mail-toolbar"><span>收件箱</span><span id="mailMeta">1 封邮件</span></div>
        <div id="mailList" class="mail-list"></div>
      </div>
    </section>
  </template>

  <template id="archiveTemplate">
    <section class="archive-page page-enter">
      <p class="eyebrow">CASE ARCHIVE</p><h1>案件档案</h1>
      <div id="archiveList" class="archive-grid"></div>
    </section>
  </template>

  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
